<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📻 Happy Birthday - 复古温暖</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #92400e 0%, #b45309 50%, #d97706 100%);
            color: #fef3c7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(254, 243, 199, 0.2);
            max-width: 900px;
            margin: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .vintage-border {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid rgba(254, 243, 199, 0.3);
            border-radius: 20px;
            pointer-events: none;
        }

        .emoji-main {
            font-size: 100px;
            margin-bottom: 30px;
            animation: swing 3s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        h1 {
            font-size: 72px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #fef3c7;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 3px;
        }

        .recipient-name {
            font-family: 'Dancing Script', cursive;
            font-size: 56px;
            margin: 30px 0;
            color: #fde68a;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
        }

        .message {
            font-size: 24px;
            line-height: 2;
            max-width: 700px;
            margin: 40px auto;
            color: #fef3c7;
            padding: 30px;
            font-style: italic;
            position: relative;
        }

        .message::before,
        .message::after {
            font-size: 60px;
            color: rgba(254, 243, 199, 0.3);
            position: absolute;
        }

        .message::before {
            content: '"';
            top: 0;
            left: 0;
        }

        .message::after {
            content: '"';
            bottom: -20px;
            right: 0;
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #fef3c7, transparent);
            margin: 40px auto;
        }

        .sender {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #fde68a;
            margin-top: 40px;
        }

        .vintage-particles {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .dust {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(254, 243, 199, 0.3);
            border-radius: 50%;
            animation: dustFloat 10s linear infinite;
        }

        @keyframes dustFloat {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        .date {
            margin-top: 40px;
            font-size: 16px;
            color: rgba(254, 243, 199, 0.6);
            letter-spacing: 2px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 48px;
            }

            .recipient-name {
                font-size: 40px;
            }

            .message {
                font-size: 18px;
                padding: 20px;
            }

            .emoji-main {
                font-size: 72px;
            }

            .container {
                padding: 40px 20px;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="vintage-particles" id="particles"></div>
    <div class="vintage-border"></div>
    
    <div class="container">
        <div class="emoji-main">📻</div>
        <h1>Happy Birthday</h1>
        <div class="recipient-name" id="recipientName">怀旧时光</div>
        <div class="message" id="birthdayMessage">祝你生日快乐，愿你的每一天都充满阳光与欢笑！</div>
        <div class="divider"></div>
        <div class="sender" id="senderName">— 你的朋友</div>
        <div class="date" id="date"></div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('birthdayData') || '{}');
        document.getElementById('recipientName').textContent = data.recipientName || '怀旧时光';
        document.getElementById('birthdayMessage').textContent = data.message || '祝你生日快乐！';
        document.getElementById('senderName').textContent = '— ' + (data.senderName || '你的朋友');
        document.getElementById('date').textContent = data.date || new Date().toLocaleDateString('zh-CN');

        // 创建灰尘粒子
        const particles = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const dust = document.createElement('div');
            dust.className = 'dust';
            dust.style.left = Math.random() * 100 + '%';
            dust.style.animationDelay = Math.random() * 10 + 's';
            dust.style.animationDuration = (8 + Math.random() * 4) + 's';
            dust.style.width = (2 + Math.random() * 3) + 'px';
            dust.style.height = dust.style.width;
            particles.appendChild(dust);
        }
    </script>
</body>
</html>
