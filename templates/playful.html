<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎈 Happy Birthday - 活泼派对</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ec4899 0%, #f59e0b 50%, #10b981 100%);
            background-size: 200% 200%;
            animation: gradientShift 5s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
        }

        .balloons {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 80px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: balloonFloat 6s ease-in-out infinite;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
        }

        @keyframes balloonFloat {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }
            50% {
                transform: translateY(-30px) rotate(5deg);
            }
        }

        .emoji-main {
            font-size: 120px;
            animation: bounce 1s infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        h1 {
            font-size: 80px;
            font-weight: 700;
            color: white;
            margin: 30px 0;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .recipient-name {
            font-size: 48px;
            color: white;
            margin: 20px 0;
            font-weight: 700;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .message {
            font-size: 24px;
            line-height: 1.8;
            max-width: 700px;
            margin: 40px auto;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .sender {
            font-size: 28px;
            color: white;
            margin-top: 40px;
            font-weight: 600;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confettiFall 5s linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .date {
            margin-top: 30px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 768px) {
            h1 { font-size: 48px; }
            .recipient-name { font-size: 32px; }
            .message { font-size: 18px; padding: 20px; }
            .emoji-main { font-size: 80px; }
        }
    </style>
</head>
<body>
    <div class="balloons" id="balloons"></div>
    
    <div class="container">
        <div class="emoji-main">🎈</div>
        <h1>Happy Birthday!</h1>
        <div class="recipient-name" id="recipientName">🎉 派对时间 🎉</div>
        <div class="message" id="birthdayMessage">祝你生日快乐，愿你的每一天都充满阳光与欢笑！</div>
        <div class="sender" id="senderName">— 你的朋友</div>
        <div class="date" id="date"></div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('birthdayData') || '{}');
        document.getElementById('recipientName').textContent = data.recipientName || '🎉 派对时间 🎉';
        document.getElementById('birthdayMessage').textContent = data.message || '祝你生日快乐！';
        document.getElementById('senderName').textContent = '— ' + (data.senderName || '你的朋友');
        document.getElementById('date').textContent = data.date || new Date().toLocaleDateString('zh-CN');

        // 创建气球
        const balloons = document.getElementById('balloons');
        const colors = ['#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ef4444'];
        
        for (let i = 0; i < 15; i++) {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.top = Math.random() * 100 + '%';
            balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.animationDelay = Math.random() * 6 + 's';
            balloon.style.animationDuration = (4 + Math.random() * 4) + 's';
            balloons.appendChild(balloon);
        }

        // 创建五彩纸屑
        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDelay = Math.random() * 5 + 's';
            confetti.style.animationDuration = (3 + Math.random() * 4) + 's';
            confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            document.body.appendChild(confetti);
        }
    </script>
</body>
</html>
