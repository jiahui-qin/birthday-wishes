<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Happy Birthday - 宇宙星空</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            color: #c4b5fd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity:0;
                transform: scale(0.9);
            }
            to {
                opacity:1;
                transform: scale(1);
            }
        }

        .stars {
            position: fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity:0;
                transform: scale(0.5);
            }
            50% {
                opacity:1;
                transform: scale(1.5);
            }
        }

        .shooting-star {
            position: absolute;
            width:2px;
            height:2px;
            background: white;
            animation: shoot 2s linear infinite;
        }

        @keyframes shoot {
            0% {
                transform: translateX(0) translateY(0);
                opacity:1;
            }
            100% {
                transform: translateX(500px) translateY(500px);
                opacity:0;
            }
        }

        .emoji-main {
            font-size: 100px;
            margin-bottom: 30px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(196, 181, 253, 0.5);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 40px rgba(196, 181, 253, 0.8), 0 0 60px rgba(139, 92, 246, 0.5);
                transform: scale(1.1);
            }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.3);
            }
        }

        .recipient-name {
            font-size: 48px;
            color: #a78bfa;
            margin: 30px 0;
            font-weight: 300;
            letter-spacing: 4px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .message {
            font-size: 22px;
            line-height: 2;
            max-width: 750px;
            margin: 40px auto;
            color: #c4b5fd;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(196, 181, 253, 0.2);
        }

        .sender {
            font-size: 28px;
            color: #8b5cf6;
            margin-top: 50px;
            font-weight: 600;
        }

        .planets {
            position: fixed;
            width:100%;
            height:100%;
            top:0;
            left:0;
            pointer-events: none;
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            animation: planetRotate 20s linear infinite;
        }

        @keyframes planetRotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .date {
            margin-top: 40px;
            font-size: 16px;
            color: rgba(196, 181, 253, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            h1 { font-size: 42px; }
            .recipient-name { font-size: 32px; }
            .message { 
                font-size: 18px; 
                padding: 30px 20px;
            }
            .emoji-main { font-size: 72px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="planets" id="planets"></div>
    
    <div class="container">
        <div class="emoji-main">🌌</div>
        <h1>Happy Birthday</h1>
        <div class="recipient-name" id="recipientName">星辰大海</div>
        <div class="message" id="birthdayMessage">祝你生日快乐，愿你的每一天都充满阳光与欢笑！</div>
        <div class="sender" id="senderName">— 你的朋友</div>
        <div class="date" id="date"></div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('birthdayData') || '{}');
        document.getElementById('recipientName').textContent = data.recipientName || '星辰大海';
        document.getElementById('birthdayMessage').textContent = data.message || '祝你生日快乐！';
        document.getElementById('senderName').textContent = '— ' + (data.senderName || '你的朋友');
        document.getElementById('date').textContent = data.date || new Date().toLocaleDateString('zh-CN');

        // 创建星星
        const stars = document.getElementById('stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = (Math.random() * 3 + 1) + 'px';
            star.style.height = star.style.width;
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (2 + Math.random() * 2) + 's';
            stars.appendChild(star);
        }

        // 创建流星
        for (let i = 0; i < 3; i++) {
            const shootingStar = document.createElement('div');
            shootingStar.className = 'shooting-star';
            shootingStar.style.left = Math.random() * 100 + '%';
            shootingStar.style.top = Math.random() * 50 + '%';
            shootingStar.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(shootingStar);
        }

        // 创建行星
        const planets = document.getElementById('planets');
        const planetColors = ['#7c3aed', '#a78bfa', '#c4b5fd', '#6d28d9'];
        
        for (let i = 0; i < 4; i++) {
            const planet = document.createElement('div');
            planet.className = 'planet';
            planet.style.width = (50 + Math.random() * 100) + 'px';
            planet.style.height = planet.style.width;
            planet.style.left = Math.random() * 100 + '%';
            planet.style.top = Math.random() * 100 + '%';
            planet.style.background = planetColors[i];
            planet.style.opacity = '0.1';
            planet.style.animationDuration = (15 + Math.random() * 10) + 's';
            planets.appendChild(planet);
        }
    </script>
</body>
</html>
