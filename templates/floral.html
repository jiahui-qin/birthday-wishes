<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Happy Birthday - 花卉浪漫</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-flowers {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .flower {
            position: absolute;
            font-size: 30px;
            animation: flowerFloat 8s ease-in-out infinite;
        }

        @keyframes flowerFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-40px) rotate(180deg);
                opacity: 1;
            }
        }

        .emoji-main {
            font-size: 100px;
            margin-bottom: 30px;
            animation: bloom 2s ease;
        }

        @keyframes bloom {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(0deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 72px;
            color: #831843;
            margin-bottom: 30px;
            text-shadow: 0 5px 15px rgba(131, 24, 67, 0.2);
        }

        .recipient-name {
            font-family: 'Dancing Script', cursive;
            font-size: 56px;
            color: #9d174d;
            margin: 30px 0;
            animation: slideIn 1s ease 0.5s both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message {
            font-size: 22px;
            line-height: 2;
            max-width: 700px;
            margin: 40px auto;
            color: #831843;
            background: rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(131, 24, 67, 0.1);
        }

        .sender {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #be185d;
            margin-top: 50px;
        }

        .petal {
            position: absolute;
            width: 15px;
            height: 15px;
            background: #fbcfe8;
            border-radius: 50% 0 50% 0;
            animation: petalFall 10s linear infinite;
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .date {
            margin-top: 40px;
            font-size: 16px;
            color: #9d174d;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            h1 { font-size: 48px; }
            .recipient-name { font-size: 36px; }
            .message { 
                font-size: 18px; 
                padding: 30px 20px;
            }
            .emoji-main { font-size: 72px; }
        }
    </style>
</head>
<body>
    <div class="floating-flowers" id="flowers"></div>
    
    <div class="container">
        <div class="emoji-main">🌸</div>
        <h1>Happy Birthday</h1>
        <div class="recipient-name" id="recipientName">花开花落</div>
        <div class="message" id="birthdayMessage">祝你生日快乐，愿你的每一天都充满阳光与欢笑！</div>
        <div class="sender" id="senderName">— 你的朋友</div>
        <div class="date" id="date"></div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('birthdayData') || '{}');
        document.getElementById('recipientName').textContent = data.recipientName || '花开花落';
        document.getElementById('birthdayMessage').textContent = data.message || '祝你生日快乐！';
        document.getElementById('senderName').textContent = '— ' + (data.senderName || '你的朋友');
        document.getElementById('date').textContent = data.date || new Date().toLocaleDateString('zh-CN');

        // 创建漂浮花朵
        const flowers = document.getElementById('flowers');
        const flowerEmojis = ['🌸', '🌺', '🌷', '🌹', '💐', '🏵️'];

        for (let i = 0; i < 12; i++) {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
            flower.style.left = Math.random() * 100 + '%';
            flower.style.top = Math.random() * 100 + '%';
            flower.style.animationDelay = Math.random() * 8 + 's';
            flower.style.animationDuration = (6 + Math.random() * 4) + 's';
            flowers.appendChild(flower);
        }

        // 创建花瓣飘落
        for (let i = 0; i < 30; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + '%';
            petal.style.animationDelay = Math.random() * 10 + 's';
            petal.style.animationDuration = (8 + Math.random() * 4) + 's';
            petal.style.background = ['#fbcfe8', '#f9a8d4', '#f472b6'][Math.floor(Math.random() * 3)];
            document.body.appendChild(petal);
        }
    </script>
</body>
</html>
