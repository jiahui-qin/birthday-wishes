<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日贺卡</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .birthday-card {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 主题样式 */
        .theme-floral { background: linear-gradient(135deg, #ffeaa7, #fab1a0); }
        .theme-elegant { background: linear-gradient(135deg, #a8edea, #fed6e3); }
        .theme-playful { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
        .theme-minimalist { background: white; color: #333; }
        .theme-cosmic { background: linear-gradient(135deg, #0c0c1d, #1a1a3e); color: white; }
        .theme-vintage { background: linear-gradient(135deg, #f5e6ca, #d4a574); }

        .recipient-name {
            font-size: 3em;
            margin: 20px 0;
            animation: slideIn 1s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .message {
            font-size: 1.5em;
            margin: 30px 0;
            line-height: 1.8;
            animation: fadeIn 1.2s ease-out;
        }

        .sender-name {
            font-size: 1.2em;
            margin-top: 40px;
            font-style: italic;
            animation: fadeIn 1.4s ease-out;
        }

        .date {
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
        }

        .theme-cosmic .date,
        .theme-cosmic .sender-name {
            color: #aaa;
        }

        #loading, #error {
            text-align: center;
            color: white;
            font-size: 1.5em;
            margin-top: 100px;
        }

        #error {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div id="loading">🎂 加载中...</div>
    <div id="birthdayCard" style="display: none;">
        <div class="birthday-card" id="cardContent">
            <div class="recipient-name" id="recipientName"></div>
            <div class="message" id="birthdayMessage"></div>
            <div class="sender-name" id="senderName"></div>
            <div class="date" id="date"></div>
        </div>
    </div>
    <div id="error" style="display: none;"></div>

    <script src="/js/api.js"></script>
    <script>
        (async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const pageId = urlParams.get('id');

            if (!pageId) {
                showError('缺少页面 ID');
                return;
            }

            try {
                const result = await window.birthdayAPI.getPage(pageId);
                
                if (!result.success) {
                    showError(result.message);
                    return;
                }

                displayPage(result.page);
                increaseViews(pageId);
            } catch (error) {
                showError('加载失败：' + error.message);
            }
        })();

        function displayPage(page) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('birthdayCard').style.display = 'block';

            // 应用主题
            const card = document.getElementById('cardContent');
            card.className = 'birthday-card theme-' + page.theme;

            // 填充数据
            document.getElementById('recipientName').textContent = '🎉 ' + page.title + ' 🎂';
            document.getElementById('birthdayMessage').textContent = page.message;
            
            if (page.senderName) {
                document.getElementById('senderName').textContent = '—— ' + page.senderName;
            }
            
            if (page.createdAt) {
                const date = new Date(page.createdAt).toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                document.getElementById('date').textContent = date;
            }

            // 更新页面标题
            document.title = page.title + ' 的生日贺卡';
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = '❌ ' + message;
        }

        async function increaseViews(pageId) {
            try {
                // 可选：调用 API 增加浏览次数
                // await window.birthdayAPI.increaseViews(pageId);
            } catch (error) {
                console.warn('Failed to increase views:', error);
            }
        }
    </script>
</body>
</html>
