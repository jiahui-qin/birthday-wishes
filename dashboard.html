<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 我的贺卡 - 生日祝福生成器</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">🎂 生日祝福生成器</div>
            <div class="nav-links">
                <a href="/index.html" class="nav-link">创建贺卡</a>
                <a href="/dashboard.html" class="nav-link active">我的贺卡</a>
                <div class="user-info">
                    <span class="username" id="usernameDisplay"></span>
                    <button class="btn-logout" onclick="logout()">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="dashboard-container">
        <div class="container">
            <div class="dashboard-header">
                <h1 class="dashboard-title">🎁 我的贺卡</h1>
                <a href="index.html" class="btn-create">+ 创建新贺卡</a>
            </div>

            <!-- 统计信息 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalCards">0</span>
                        <span class="stat-label">总贺卡数</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👁️</div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalViews">0</span>
                        <span class="stat-label">总浏览量</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👍</div>
                    <div class="stat-info">
                        <span class="stat-number" id="totalLikes">0</span>
                        <span class="stat-label">总点赞数</span>
                    </div>
                </div>
            </div>

            <!-- 贺卡列表 -->
            <div class="cards-section">
                <h2 class="section-subtitle">所有贺卡</h2>
                <div class="cards-grid" id="cardsGrid">
                    <!-- 贺卡卡片将通过 JavaScript 动态生成 -->
                </div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <div class="empty-icon">🎂</div>
                    <h3>还没有创建贺卡</h3>
                    <p>点击"创建新贺卡"开始制作你的第一个生日祝福吧！</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>🎂 生日祝福网站生成器 | 用心传递每一份祝福</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
